<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forms and Validation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <h1 class="text-center mb-4">Forms and Validation</h1>

    <h2>Task 0: Contact Form</h2>

    <form class="mb-5">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" class="form-control mb-3">

        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control mb-3">

        <label for="message" class="form-label">Message</label>
        <textarea id="message" class="form-control mb-3"></textarea>

        <button type="submit" class="btn btn-primary">Send</button>
    </form>

    <h2>Task 1: HTML5 Validation</h2>

    <form class="mb-5">
        <label for="name2" class="form-label">Name</label>
        <input type="text" id="name2" class="form-control mb-3"
               required minlength="2">

        <label for="email2" class="form-label">Email</label>
        <input type="email" id="email2" class="form-control mb-3" required>

        <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <h2>Task 2: Bootstrap Form</h2>

<form class="mb-5">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="name3" class="form-label">Name</label>
            <input type="text" id="name3" class="form-control"
                   placeholder="Enter your name">
        </div>

        <div class="col-md-6 mb-3">
            <label for="email3" class="form-label">Email</label>
            <input type="email" id="email3" class="form-control"
                   placeholder="Enter your email">
            <div class="form-text">We will use this email to contact you.</div>
        </div>

        <div class="col-12 mb-3">
            <label for="message3" class="form-label">Message</label>
            <textarea id="message3" class="form-control"
                      placeholder="Write your message"></textarea>
        </div>
    </div>

    <button type="submit" class="btn btn-primary">Send</button>
</form>

    <h2>Task 3: Bootstrap Validation</h2>

    <form class="mb-5" id="form3" novalidate>
        <label for="email3" class="form-label">Email</label>
        <input type="email" id="email3" class="form-control" required>

        <div class="invalid-feedback">Please enter a valid email.</div>
        <div class="valid-feedback">Looks good!</div>

        <button type="submit" class="btn btn-success mt-3">Check</button>
    </form>

    <h2>Task 4: Registration Form</h2>

    <form id="form4" novalidate>
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" id="firstName" class="form-control mb-3"
               required minlength="2">
        <div class="invalid-feedback">Enter your first name.</div>

        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" id="lastName" class="form-control mb-3"
               required minlength="2">
        <div class="invalid-feedback">Enter your last name.</div>

        <label for="email4" class="form-label">Email</label>
        <input type="email" id="email4" class="form-control mb-3" required>

        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control mb-3"
               required minlength="8">

        <label for="confirm" class="form-label">Confirm Password</label>
        <input type="password" id="confirm" class="form-control mb-3" required>

        <p>Gender</p>
        <input type="radio" name="gender" id="male" required>
        <label for="male">Male</label>

        <input type="radio" name="gender" id="female" required>
        <label for="female">Female</label>

        <p class="mt-3">Hobbies</p>
        <input type="checkbox" id="sport">
        <label for="sport">Sports</label>

        <input type="checkbox" id="music">
        <label for="music">Music</label>

        <div class="mt-3">
            <label for="country" class="form-label">Country</label>
            <select id="country" class="form-select mb-3" required>
                <option value="">Choose country</option>
                <option>Kazakhstan</option>
                <option>Kyrgyzstan</option>
                <option>Uzbekistan</option>
                <option>Other</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Register</button>
        <button type="reset" class="btn btn-secondary">Reset</button>
    </form>

</div>

<script>
document.getElementById("form3").addEventListener("submit", function(event) {
    event.preventDefault();
    this.classList.add("was-validated");
});

document.getElementById("form4").addEventListener("submit", function(event) {
    event.preventDefault();

    let password = document.getElementById("password");
    let confirm = document.getElementById("confirm");

    if (password.value != confirm.value) {
        confirm.setCustomValidity("Passwords do not match");
    } else {
        confirm.setCustomValidity("");
    }

    this.classList.add("was-validated");

    if (this.checkValidity()) {
        alert("Registration successful!");
    }
});
</script>

</body>
</html>
